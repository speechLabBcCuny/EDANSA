channels:
  - conda-forge # Primary channel
  - defaults
dependencies:
  # Python requirement
  - python>=3.8,<3.12

  # Core ML Dependencies
  - pytorch-gpu>=2.6,<3
  - torchvision>=0.21,<0.22
  - pytorch-ignite>=0.5,<0.6
  
  # Other Dependencies
  - pyyaml>=6.0,<7.0
  - scikit-learn>=1.6,<1.7
  - matplotlib>=3
  - numpy>=2
  - wandb>=0.19,<1
  - tqdm>=4.67
  - pandas>=2.2,<3.0
  - pytest>=9.0.3,<10.0
  - pytest-mock>=3.14,<4.0
  # ffmpeg is required for torchaudio
  - ffmpeg>=6,<7
  - requests

  - pip  # make sure pip is available

  - pip:
      # Install FFmpeg-enabled torchaudio from official PyTorch wheel
      - torchaudio --index-url https://download.pytorch.org/whl/cu118
      - -e .
