channels:
  - conda-forge # Primary channel
  - defaults
dependencies:
  # Python requirement
  - python>=3.10,<3.15

  # Core ML Dependencies
  - pytorch>=2.10,<3 # CPU-only build
  - torchvision>=0.25,<0.26 # Will pick up CPU variant
  - pytorch-ignite>=0.5,<0.6
  
  # Other Dependencies
  - pyyaml>=6.0,<7.0
  - scikit-learn>=1.6,<1.7
  - matplotlib>=3
  - numpy>=2
  - wandb>=0.19,<1
  - tqdm>=4.67
  - pandas>=2.2,<3.0
  - pytest>=8.3,<9.0
  - pytest-mock>=3.14,<4.0
  # ffmpeg is required for torchaudio
  - ffmpeg>=6,<7
  - requests

  - pip  # make sure pip is available

  - pip:
      # Install FFmpeg-enabled torchaudio from official PyTorch wheel for CPU
      - torchaudio>=2.10,<3 --index-url https://download.pytorch.org/whl/cpu
      - -e .
